[package]
name = "ultimate-pixel"
version = "0.2.0"
edition = "2021"

[lib]
name = "ultimate_pixel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"   # lo usa generate_context! con la configuración de los plugins

# actualizador: solo escritorio (en Android el APK nuevo se abre con opener)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
