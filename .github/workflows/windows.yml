name: Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash check-version.sh   # la app tiene que llevar la versión del juego
      - run: npm install -g @tauri-apps/cli@2
      # instalador NSIS (por usuario, sin pedir permisos de administrador); trae WebView2 si falta.
      # La firma para el actualizador la agrega release.sh en el VPS.
      - run: tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-pixel-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
