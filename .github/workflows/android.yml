name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK y NDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bash check-version.sh   # la app tiene que llevar la versión del juego
      - run: npm ci --no-audit --no-fund
      - name: Proyecto Android (íconos del juego, horizontal, pantalla completa)
        run: |
          npm run tauri -- android init --ci
          M=src-tauri/gen/android/app/src/main
          cp -r src-tauri/icons/android/. $M/res/
          sed -i "s/#FFFFFF/#4FA457/" $M/res/values/ic_launcher_background.xml   # verde de la cancha
          grep -q screenOrientation $M/AndroidManifest.xml || sed -i "0,/<activity/s//<activity android:screenOrientation=\"sensorLandscape\"/" $M/AndroidManifest.xml
          cp android/MainActivity.kt "$(find $M/java -name MainActivity.kt)"
      - run: npm run tauri -- android build --apk --target aarch64 --ci
      # firma con la clave definitiva (secretos del repo): sin la misma clave no hay actualizaciones
      - name: Firmar APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V=$(cat web/app-version.txt)
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          mkdir -p dist-android
          zipalign -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          OUT=dist-android/UltimatePixel-$V-arm64.apk
          apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          apksigner verify "$OUT"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-pixel-android
          path: dist-android/*.apk
